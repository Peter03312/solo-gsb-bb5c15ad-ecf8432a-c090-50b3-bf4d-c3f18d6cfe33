services:
  db:
    image: postgres:16-alpine
    container_name: restriction-db
    environment:
      POSTGRES_USER: restrict
      POSTGRES_PASSWORD: restrict
      POSTGRES_DB: restrict
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U restrict -d restrict"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    container_name: restriction-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://restrict:restrict@db:5432/restrict
      DB_CONNECT_RETRIES: "30"
      DB_CONNECT_INTERVAL: "1"
    ports:
      - "${API_PORT:-8000}:8000"

volumes:
  pgdata:
